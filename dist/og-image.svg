<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf8f5"/>
      <stop offset="50%" style="stop-color:#f5efe8"/>
      <stop offset="100%" style="stop-color:#f8ece0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a86c"/>
      <stop offset="100%" style="stop-color:#d4a574"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#c9a86c" stroke-width="2" rx="10"/>
  <rect x="35" y="35" width="1130" height="560" fill="none" stroke="#c9a86c" stroke-width="1" rx="8" opacity="0.5"/>
  
  <!-- Top ornament -->
  <text x="600" y="80" text-anchor="middle" font-size="32" fill="#c9a86c">✦</text>
  
  <!-- Main title -->
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="90" font-style="italic" fill="#2c2420">Ziya</text>
  <text x="600" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="50" fill="#c9a86c">&amp;</text>
  <text x="600" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="90" font-style="italic" fill="#2c2420">Nooha</text>
  
  <!-- Subtitle -->
  <text x="600" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#8b5a5a" letter-spacing="8">WEDDING INVITATION</text>
  
  <!-- Date -->
  <text x="600" y="510" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#4a4a4a" letter-spacing="4">1 • AUGUST • 2026</text>
  
  <!-- Bottom ornament -->
  <text x="600" y="580" text-anchor="middle" font-size="32" fill="#c9a86c">✦</text>
  
  <!-- Corner decorations -->
  <text x="60" y="70" font-size="24" fill="#c9a86c" opacity="0.6">❧</text>
  <text x="1140" y="70" font-size="24" fill="#c9a86c" opacity="0.6" transform="scale(-1,1) translate(-2280,0)">❧</text>
  <text x="60" y="600" font-size="24" fill="#c9a86c" opacity="0.6" transform="scale(1,-1) translate(0,-1200)">❧</text>
  <text x="1140" y="600" font-size="24" fill="#c9a86c" opacity="0.6" transform="scale(-1,-1) translate(-2280,-1200)">❧</text>
</svg>
